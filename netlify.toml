# Pulse on Netlify: a plain static site, no build step.
[build]
  publish = "."

# Internal tool: keep it out of search engines, and keep the version check fresh.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

# Server source files are not part of the site.
[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true

# book.victoriagillespieconsulting.com shows the booking page under its own address (no visible redirect).
# "/" opens VGCG Introduction; "/<meeting-type>" opens that type. Real files (logo, icons) still load as files.
[[redirects]]
  from = "https://book.victoriagillespieconsulting.com/"
  to = "/book.html"
  status = 200
  force = true

[[redirects]]
  from = "https://book.victoriagillespieconsulting.com/:slug"
  to = "/book.html"
  status = 200

# Public booking pages: /book and /book/<meeting-type> serve book.html.
[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

[[redirects]]
  from = "/book/*"
  to = "/book.html"
  status = 200
