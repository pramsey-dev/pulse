# Pulse on Netlify: a plain static site, no build step.
[build]
  publish = "."

# Internal tool: keep it out of search engines, and keep the version check fresh.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

# book.victoriagillespieconsulting.com sends people straight to the VGCG Introduction booking page.
# 302 (not 301) so browsers don't cache it and it can be pointed elsewhere later.
[[redirects]]
  from = "https://book.victoriagillespieconsulting.com/*"
  to = "https://pulsedotdash.netlify.app/book/vgcg-introduction"
  status = 302
  force = true

# Public booking pages: /book and /book/<meeting-type> serve book.html.
[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

[[redirects]]
  from = "/book/*"
  to = "/book.html"
  status = 200

# Server source files are not part of the site.
[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true
